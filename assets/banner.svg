<svg width="772" height="250" viewBox="0 0 772 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lean SMTP — minimal SMTP and API mail routing for WordPress">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="772" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#312A9E"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="772" height="250" fill="url(#bg)"/>

  <!-- Faint decorative dot grid, right side -->
  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="512" cy="40" r="3"/><circle cx="548" cy="40" r="3"/><circle cx="584" cy="40" r="3"/><circle cx="620" cy="40" r="3"/><circle cx="656" cy="40" r="3"/><circle cx="692" cy="40" r="3"/><circle cx="728" cy="40" r="3"/>
    <circle cx="512" cy="212" r="3"/><circle cx="548" cy="212" r="3"/><circle cx="584" cy="212" r="3"/><circle cx="620" cy="212" r="3"/><circle cx="656" cy="212" r="3"/><circle cx="692" cy="212" r="3"/><circle cx="728" cy="212" r="3"/>
  </g>

  <!-- Mark, right side -->
  <g transform="translate(556 33) scale(0.72)">
    <circle cx="128" cy="125" r="150" fill="url(#halo)"/>
    <rect x="40" y="58" width="176" height="120" rx="18" fill="#FFFFFF"/>
    <path d="M53 74 L128 130 L203 74" fill="none" stroke="#312A9E" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="200" width="140" height="18" rx="9" fill="url(#arrow)"/>
    <path d="M178 179 L220 209 L178 239 Z" fill="url(#arrow)"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="122" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">Lean SMTP</text>

  <!-- Tagline -->
  <text x="62" y="160" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#C7D2FE">Minimal SMTP &amp; API mail routing for WordPress</text>

  <!-- Provider line -->
  <text x="62" y="200" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E0E7FF">SMTP<tspan dx="12" fill="#FBBF24" font-weight="700">·</tspan><tspan dx="12">Amazon SES</tspan><tspan dx="12" fill="#FBBF24" font-weight="700">·</tspan><tspan dx="12">Mailgun</tspan><tspan dx="12" fill="#FBBF24" font-weight="700">·</tspan><tspan dx="12">Resend</tspan></text>
</svg>
